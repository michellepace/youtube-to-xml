repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.15
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (fast)
        entry: uv run pytest -m "not slow"
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-all
        name: pytest (full suite)
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

# Notes:
# 1. `uv-lock` syncs uv.lock with pyproject.toml, then blocks the commit for review
# 2. `--exit-non-zero-on-fix` blocks commits when ruff auto-fixes, so changes get reviewed
# 3. `pass_filenames: false` runs pyright/pytest project-wide, not just on changed files
# 4. Fast tests run at commit; full suite (incl. slow network tests) runs at push
