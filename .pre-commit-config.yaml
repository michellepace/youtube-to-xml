repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.15
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (fast)
        entry: uv run pytest -m "not slow"
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-all
        name: pytest (full suite)
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: xmllint
        name: xmllint
        entry: xmllint --noout
        language: system
        types: [xml]

# Notes:
# 1. `uv-lock` syncs uv.lock with pyproject.toml, then blocks commit for review
# 2. Python tools run via `uv run` (single version source: pyproject.toml)
# 3. `ruff-format` precedes `ruff-check` so linting validates formatted code
# 4. `--exit-non-zero-on-fix` blocks commits when ruff auto-fixes, must review changes
# 5. `pass_filenames: false` runs pyright/pytest project-wide, not just on changed files
# 6. Fast tests run at commit; full suite (incl. slow network tests) runs at push
