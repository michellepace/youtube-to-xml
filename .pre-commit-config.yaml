repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict    # block on merge markers
        fail_fast: true
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^\.vscode/         # .vscode/*.json is JSONC (has comments)
      - id: check-toml

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.30
    hooks:
      - id: uv-lock

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.1
    hooks:
      - id: markdownlint-cli2       # autofix markdown (.markdownlint-cli2.yaml)
        args: [--fix]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (fast)
        entry: uv run pytest -m "not slow"
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-all
        name: pytest (full suite)
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: xmllint
        name: xmllint
        entry: xmllint --noout
        language: system
        types: [xml]
