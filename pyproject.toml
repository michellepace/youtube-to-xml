[build-system]
# Packaged for the [project.scripts] CLIs only; never published.
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[project]
name = "youtube-to-xml"
version = "0.1.0"
description = "Convert YouTube transcripts to structured XML format"
readme = "README.md"
authors = [{ name = "Michelle", email = "your.email@example.com" }]
requires-python = ">=3.14"
dependencies = ["yt-dlp>=2026.8.19"]

[project.scripts]
youtube-to-xml = "youtube_to_xml.cli:main"

[dependency-groups]
dev = ["pre-commit>=4.7.0", "pyright>=1.1.414", "pytest>=9.1.1", "ruff>=0.17.0"]


# PACKAGE MANAGER (UV)
# =================================
# Uncomment to allow PyPI pre-releases (e.g. yt-dlp dev builds "2025.9.19.232813.dev0").
# Even when enabled, run `uv lock --upgrade` to pull them into the lockfile.
# [tool.uv]
# prerelease = "allow"


# TESTING (PYTEST)
# =================================
[tool.pytest.ini_options]
markers = [
  "slow: tests that require internet connection (hit yt-dlp API) (reviewed and confirmed)",
]


# TYPE CHECKING (PYRIGHT)
# =================================
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."                # Claude Code Official: LSP plugin
venv = ".venv"                # Claude Code Official: LSP plugin
reportUnusedImport = false    # Ruff F401 covers it
reportUnusedVariable = false  # Ruff F841
reportDuplicateImport = false # Ruff F811


# LINTING (RUFF)
# =================================
[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [ # ignore incompatible or overly pedantic rules
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D203",   # blank line before class docstring (conflicts with D211)
  "D213",   # multi-line summary starts on line 2 (conflicts with D212)
  "COM812", # Trailing comma missing (conflicts with formatter)
  "ISC001", # implicit string concatenation (conflicts with formatter)
  "T201",   # Print found (allow print statements)
  "CPY001", # Missing copyright notice (never published)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101",    # assert statements are idiomatic in tests
  "PLR2004", # literal expected values are fine
  "D103",    # Missing docstring in public function
  "S314",    # XML parsing (safe in tests with self-generated XML)
  "S607",    # partial executable paths (controlled test env)
]
"src/youtube_to_xml/cli.py" = [
  "TRY400", # logger.error for handled user errors (no traceback needed)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Both sections restate Ruff's defaults — kept visible
[tool.ruff.lint.pylint]
max-args = 5        # PLR0913
max-branches = 12   # PLR0912
max-returns = 6     # PLR0911
max-statements = 50 # PLR0915

[tool.ruff.lint.mccabe]
max-complexity = 10 # C901
